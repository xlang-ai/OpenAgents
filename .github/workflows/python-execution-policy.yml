name: Python execution policy

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'real_agents/**'
      - 'docker-compose.yml'
      - 'tests/**'
      - '.github/workflows/python-execution-policy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'real_agents/**'
      - 'docker-compose.yml'
      - 'tests/**'
      - '.github/workflows/python-execution-policy.yml'

permissions:
  contents: read

jobs:
  execution-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tests/requirements-execution.txt
      - run: python -m pip install -r tests/requirements-execution.txt
      - run: python -m pytest -q tests/test_python_execution_policy.py
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          CODE_EXECUTION_MODE=local ALLOW_UNSAFE_LOCAL_CODE_EXECUTION=true docker compose config --quiet
          CODE_EXECUTION_MODE=docker docker compose config --quiet
