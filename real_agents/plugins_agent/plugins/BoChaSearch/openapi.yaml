openapi: 3.0.0
info:
  title: Bocha Search API
  version: 1.0.0
  description: Bocha Search API. Search the world’s information, including webpages, related keywords and more.
paths:
  /bochasearch:
    post:
      summary: Perform a Bocha search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The search query
              example:
                query: google inc
      responses:
        '200':
          description: Successful response
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
      servers:
        - url: https://api.bochaai.com
          description: Production Server
      security:
        - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization